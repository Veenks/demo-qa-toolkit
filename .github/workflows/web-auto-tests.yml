name: Web - Automation - Smoke Tests

on:
  push:
    paths:
      - 'web/automation/**'
  pull_request:
    paths:
      - 'web/automation/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/automation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Smoke tests
        run: pytest -m smoke --html=report.html --self-contained-html

      - name: Run Regression tests
        run: pytest -m regression --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/automation/report.html
